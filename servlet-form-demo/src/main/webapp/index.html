<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servlet 表单示例</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .required {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 用户信息表单</h1>
        <form action="submitForm" method="post">
            <div class="form-group">
                <label>姓名 <span class="required">*</span></label>
                <input type="text" name="name" required placeholder="请输入姓名">
            </div>

            <div class="form-group">
                <label>年龄 <span class="required">*</span></label>
                <input type="number" name="age" required placeholder="请输入年龄">
            </div>

            <div class="form-group">
                <label>邮箱 <span class="required">*</span></label>
                <input type="email" name="email" required placeholder="example@email.com">
            </div>

            <div class="form-group">
                <label>手机号</label>
                <input type="tel" name="phone" placeholder="请输入手机号">
            </div>

            <div class="form-group">
                <label>性别</label>
                <select name="gender">
                    <option value="">请选择</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>

            <div class="form-group">
                <label>地址</label>
                <input type="text" name="address" placeholder="请输入地址">
            </div>

            <button type="submit">提交表单</button>
        </form>
    </div>
</body>
</html>
